<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アイカツ!アンコール　カードリスト</title>
<style>
:root{
 --ink:#35263f; --pink:#f08bc0; --rose:#c74c91; --purple:#6b3b80;
 --lav:#f5eafd; --cream:#fffafc; --line:#ead9e9; --gold:#e8bd55;
 --shadow:0 10px 30px rgba(91,45,103,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(135deg,#fffaff,#f7effd 45%,#fff8fc);
 color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
 background-image:radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px),
 radial-gradient(circle at 80% 60%,#fff 0 2px,transparent 3px);background-size:48px 48px}
header{position:sticky;top:0;z-index:20;padding:14px 18px 12px;
 background:rgba(255,250,252,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#9b5ab4,#d87db0);
 display:grid;place-items:center;color:white;font-size:25px;box-shadow:var(--shadow)}
h1{font-size:clamp(18px,3vw,27px);margin:0;letter-spacing:.04em}
.sub{font-size:11px;color:#896d8e;margin-top:2px}
main{max-width:1400px;margin:0 auto;padding:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
button,.select,.input{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;
 padding:10px 13px;font:inherit;box-shadow:0 4px 12px rgba(80,30,90,.06)}
button{cursor:pointer}button:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#8f4ea8,#d66da9);color:white;border:0}
.filters{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:8px;margin-bottom:12px}
.filters input,.filters select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.stat{background:rgba(255,255,255,.85);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;background:white;border:1px solid var(--line);border-radius:18px;padding:8px;
 box-shadow:var(--shadow);cursor:pointer;transition:.18s;overflow:hidden}
.card:hover{transform:translateY(-3px)}
.card.unowned .thumb{filter:grayscale(1);opacity:.48}
.thumb{aspect-ratio:63/88;border-radius:12px;background:linear-gradient(145deg,#eadcf2,#fff);
 display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.placeholder{font-weight:800;color:#87618d;font-size:17px;text-align:center;padding:10px}
.badges{display:flex;gap:4px;position:absolute;left:7px;top:7px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.9);padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700}
.actions{position:absolute;right:7px;top:7px;display:flex;gap:5px}
.icon{width:32px;height:32px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.92);border:1px solid #ead9e9}
.icon.on{background:#fff0f7;color:#d34d91;border-color:#f1a5ca}
.icon.star.on{background:#fff8dc;color:#c4941d;border-color:#efd47a}
.cardname{font-weight:800;font-size:13px;margin:8px 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:#8b728e;display:flex;justify-content:space-between;padding:0 3px 2px}
.count{font-weight:800;color:#7a4a88}
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;z-index:40;
 background:linear-gradient(145deg,#8d4ca5,#dd6eac);color:white;border:0;font-size:24px;box-shadow:0 10px 30px #6b3b8040;display:none}
body.compactTools .filters,body.compactTools .stats{display:none}
body.compactTools .fab{display:grid;place-items:center}
dialog{border:0;border-radius:24px;padding:0;width:min(760px,94vw);max-height:90vh;box-shadow:0 25px 80px #3d174955}
dialog::backdrop{background:#32153b66;backdrop-filter:blur(4px)}
.modal{padding:20px}
.modal h2{margin:0 0 14px}
.detailgrid{display:grid;grid-template-columns:220px 1fr;gap:18px}
.detailimg{width:100%;aspect-ratio:63/88;background:#f5eafd;border-radius:16px;overflow:hidden;display:grid;place-items:center}
.detailimg img{width:100%;height:100%;object-fit:cover}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.field label{display:block;font-size:11px;color:#876f8a;margin-bottom:4px}
.field input,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px}
.switches{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.switch{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff}
.preview{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.preview img{width:75px;height:105px;object-fit:cover;border-radius:8px}
.close{float:right}
.importHelp{font-size:12px;color:#7d687f;line-height:1.7;background:#fbf5fd;padding:10px 12px;border-radius:12px}
.coord{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border-radius:12px;padding:5px}.cardname{font-size:11px}.actions .icon{width:27px;height:27px}}
@media(max-width:560px){main{padding:10px}.head{gap:9px}.logo{width:40px;height:40px}.grid{gap:7px}.filters{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.detailimg{max-width:210px;margin:auto}.sub{display:none}}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8d4ca5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アイカツ!アンコール">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header><div class="head">
 <div class="logo">✦</div><div><h1>アイカツ!アンコール　カードリスト</h1><div class="sub">SHIBUKI RAN × COOL • My Card Collection</div></div>
</div></header>
<main>
 <div class="toolbar">
  <button class="primary" id="addBtn">＋ カードを追加</button>
  <button id="photoBtn">📷 写真から追加</button>
  <button id="fileBtn">📁 ファイルから取り込み</button>
  <button id="exportBtn">💾 バックアップ</button>
  <button id="importJsonBtn">↩ 復元</button>
  <input id="photoInput" type="file" accept="image/*" multiple hidden>
  <input id="fileInput" type="file" accept=".json,.csv,image/*" multiple hidden>
  <input id="jsonInput" type="file" accept=".json" hidden>
 </div>
 <div class="filters" id="filterPanel">
  <input id="q" placeholder="🔎 アイテム名・カード番号・キャラクター">
  <select id="series"><option value="">弾数：すべて</option><option>1弾</option><option>プロモ</option></select>
  <select id="type"><option value="">タイプ：すべて</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
  <select id="category"><option value="">カテゴリ：すべて</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス&ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select>
  <select id="rarity"><option value="">レア度：すべて</option><option>プレミアムレア</option><option>レア</option><option>ノーマル</option><option>アンコールレア</option></select>
  <select id="brand"><option value="">ブランド：すべて</option><option>ノーブランド</option><option>エンジェリーシュガー</option><option>フューチャリングガール</option><option>スパイシーアゲハ</option><option>ドリーミークラウン</option><option>メープルリボン</option></select>
  <select id="status"><option value="">所持：すべて</option><option value="owned">所持</option><option value="unowned">未所持</option><option value="want">欲しいもの♡</option><option value="favorite">お気に入り★</option></select>
  <select id="parallel"><option value="">通常/パラレル：すべて</option><option value="normal">通常</option><option value="parallel">パラレル</option></select>
 </div>
 <div class="stats" id="stats"></div>
 <div class="grid" id="grid"></div>
</main>
<button class="fab" id="fab">⌕</button>

<dialog id="detailDialog"><div class="modal">
 <button class="icon close" onclick="detailDialog.close()">×</button><h2 id="detailTitle">カード詳細</h2>
 <div class="detailgrid">
  <div><div class="detailimg" id="detailImg"></div>
   <div class="switches">
    <button class="switch" id="wantBtn">♡ Want</button><button class="switch" id="favBtn">☆ Favorite</button>
   </div>
   <div class="preview" id="preview"></div>
  </div>
  <div>
   <div class="fields">
    <div class="field"><label>弾数</label><input id="dSeries"></div>
    <div class="field"><label>カードナンバー</label><input id="dCardNo"></div>
    <div class="field"><label>タイプ</label><input id="dType"></div>
    <div class="field"><label>カテゴリ</label><input id="dCategory"></div>
    <div class="field"><label>ブランド</label><input id="dBrand"></div>
    <div class="field"><label>レア度</label><input id="dRarity"></div>
    <div class="field"><label>アイテム名</label><input id="dItem"></div>
    <div class="field"><label>アピールポイント</label><input id="dAppeal" type="number"></div>
    <div class="field"><label>キャラクター</label><input id="dCharacter"></div>
    <div class="field"><label>所持枚数</label><input id="dCount" type="number" min="0"></div>
    <div class="field"><label>通常 / パラレル</label><select id="dParallel"><option value="false">通常</option><option value="true">パラレル</option></select></div>
    <div class="field"><label>通常 / プロモ</label><select id="dPromo"><option value="false">通常</option><option value="true">プロモ</option></select></div>
   </div>
   <div class="coord"><label>コーデ名</label><input id="dCoord" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"></div>
   <div class="coord"><label>カード表面・裏面</label><input id="dFiles" type="file" accept="image/*" multiple><div class="importHelp">画像を2枚選ぶと表面・裏面として保存。1枚なら表面として保存します。</div></div>
   <div style="display:flex;gap:8px;margin-top:15px"><button class="primary" id="saveDetail">保存</button><button id="deleteCard">このカードを削除</button></div>
  </div>
 </div>
</div></dialog>

<dialog id="addDialog"><div class="modal">
 <button class="icon close" onclick="addDialog.close()">×</button><h2>カードを追加</h2>
 <div class="importHelp">写真を選ぶだけでもOK。あとから詳細画面でカード情報を編集できます。JSON/CSV取り込みにも対応。</div>
 <div class="fields" style="margin-top:12px">
  <div class="field"><label>カードナンバー</label><input id="aCardNo" placeholder="E1-01"></div>
  <div class="field"><label>弾数</label><input id="aSeries" value="1弾"></div>
  <div class="field"><label>アイテム名</label><input id="aItem"></div>
  <div class="field"><label>レア度</label><input id="aRarity"></div>
 </div>
 <input id="aImage" type="file" accept="image/*" multiple style="margin-top:12px">
 <div style="margin-top:15px"><button class="primary" id="createCard">追加する</button></div>
</div></dialog>

const KEY="aikatsuEncoreCardsV1";
let cards=JSON.parse(localStorage.getItem(KEY)||"null") || seed;
let selected=null, dragId=null, lastY=window.scrollY;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(cards));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function imgHtml(src,alt=""){return src?`<img src="${src}" alt="${esc(alt)}">`:`<div class="placeholder">Aikatsu!<br><small>画像を登録してね</small></div>`}
function render(){
 const q=$("q").value.trim().toLowerCase(), series=$("series").value,type=$("type").value,cat=$("category").value,rar=$("rarity").value,brand=$("brand").value,status=$("status").value,par=$("parallel").value;
 let list=cards.filter(c=>{
  const text=[c.item,c.cardNo,c.character,c.brand,c.coordinate].join(" ").toLowerCase();
  return (!q||text.includes(q))&&(!series||c.series===series)&&(!type||c.type===type)&&(!cat||c.category===cat)&&(!rar||c.rarity===rar)&&(!brand||c.brand===brand)&&
  (!status||(status==="owned"?c.owned:status==="unowned"?(!c.owned):status==="want"?c.want:c.favorite))&&
  (!par||(par==="parallel"?c.parallel:!c.parallel));
 });
 $("stats").innerHTML=`<div class="stat">全 ${cards.length}枚</div><div class="stat">所持 ${cards.filter(c=>c.owned).length}枚</div><div class="stat">未所持 ${cards.filter(c=>!c.owned).length}枚</div><div class="stat">Want ♡ ${cards.filter(c=>c.want).length}</div><div class="stat">Favorite ★ ${cards.filter(c=>c.favorite).length}</div>`;
 $("grid").innerHTML=list.map(c=>`
 <article class="card ${c.owned?'':'unowned'}" draggable="true" data-id="${esc(c.id)}">
  <div class="thumb">${imgHtml(c.front||"",c.item||c.cardNo)}
   <div class="badges"><span class="badge">${esc(c.cardNo)}</span>${c.rarity?`<span class="badge">${esc(c.rarity)}</span>`:""}</div>
   <div class="actions">
    <button class="icon ${c.want?'on':''}" data-act="want" title="Want">♡</button>
    <button class="icon star ${c.favorite?'on':''}" data-act="favorite" title="Favorite">★</button>
   </div>
  </div>
  <div class="cardname">${esc(c.item||"アイテム名未登録")}</div>
  <div class="meta"><span>${esc(c.type||"タイプ未登録")}</span><span class="count">${c.owned?`所持 ${c.count||1}枚`:"未所持"}</span></div>
 </article>`).join("") || `<div style="grid-column:1/-1;text-align:center;padding:50px;color:#8d718f">カードが見つからないよ…💭</div>`;
 document.querySelectorAll(".card").forEach(el=>{
  el.addEventListener("click",e=>{if(e.target.closest("[data-act]"))return;openDetail(el.dataset.id)});
  el.addEventListener("dragstart",()=>dragId=el.dataset.id);
  el.addEventListener("dragover",e=>e.preventDefault());
  el.addEventListener("drop",e=>{e.preventDefault();if(!dragId||dragId===el.dataset.id)return;const a=cards.findIndex(x=>x.id===dragId),b=cards.findIndex(x=>x.id===el.dataset.id);const [m]=cards.splice(a,1);cards.splice(b,0,m);save();render()});
 });
 document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const id=b.closest(".card").dataset.id,c=cards.find(x=>x.id===id);c[b.dataset.act]=!c[b.dataset.act];save();render()}));
}
function openDetail(id){
 selected=cards.find(c=>c.id===id); if(!selected)return;
 $("detailTitle").textContent=selected.item||selected.cardNo;
 $("detailImg").innerHTML=imgHtml(selected.front||"",selected.item||selected.cardNo);
 $("preview").innerHTML=[selected.front,selected.back].filter(Boolean).map(x=>`<img src="${x}">`).join("");
 const map={dSeries:"series",dCardNo:"cardNo",dType:"type",dCategory:"category",dBrand:"brand",dRarity:"rarity",dItem:"item",dAppeal:"appeal",dCharacter:"character",dCount:"count",dParallel:"parallel",dPromo:"promo",dCoord:"coordinate"};
 Object.entries(map).forEach(([id,k])=>$(id).value=selected[k]??"");
 $("wantBtn").textContent=selected.want?"♥ Want":"♡ Want"; $("wantBtn").classList.toggle("on",selected.want);
 $("favBtn").textContent=selected.favorite?"★ Favorite":"☆ Favorite"; $("favBtn").classList.toggle("on",selected.favorite);
 detailDialog.showModal();
}
function dataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
$("saveDetail").onclick=async()=>{
 const map={dSeries:"series",dCardNo:"cardNo",dType:"type",dCategory:"category",dBrand:"brand",dRarity:"rarity",dItem:"item",dAppeal:"appeal",dCharacter:"character",dCount:"count",dCoord:"coordinate"};
 Object.entries(map).forEach(([id,k])=>selected[k]=$(id).value);
 selected.parallel=$("dParallel").value==="true";selected.promo=$("dPromo").value==="true";selected.owned=Number(selected.count)>0;
 const fs=[...$("dFiles").files];if(fs.length) {selected.front=await dataUrl(fs[0]);if(fs[1])selected.back=await dataUrl(fs[1])}
 save();detailDialog.close();render();
};
$("wantBtn").onclick=()=>{selected.want=!selected.want;save();openDetail(selected.id);render()};
$("favBtn").onclick=()=>{selected.favorite=!selected.favorite;save();openDetail(selected.id);render()};
$("deleteCard").onclick=()=>{if(confirm("このカードを削除しますか？")){cards=cards.filter(c=>c.id!==selected.id);save();detailDialog.close();render()}};
["q","series","type","category","rarity","brand","status","parallel"].forEach(id=>$(id).addEventListener("input",render));
$("addBtn").onclick=()=>addDialog.showModal();
$("createCard").onclick=async()=>{
 const fs=[...$("aImage").files], front=fs[0]?await dataUrl(fs[0]):"";
 const id=($("aCardNo").value.trim()||"NEW-"+Date.now());
 cards.push({id,cardNo:$("aCardNo").value.trim(),series:$("aSeries").value,item:$("aItem").value,rarity:$("aRarity").value,type:"",category:"",brand:"",appeal:"",character:"",owned:false,count:0,want:false,favorite:false,parallel:false,promo:$("aSeries").value==="プロモ",front,back:"",coordinate:""});
 save();addDialog.close();render();
};
$("photoBtn").onclick=()=>$("photoInput").click();
$("fileBtn").onclick=()=>$("fileInput").click();
$("photoInput").onchange=async e=>{for(const f of e.target.files){const src=await dataUrl(f);cards.push({id:"PHOTO-"+Date.now()+"-"+Math.random(),cardNo:"",series:"",type:"",category:"",brand:"",rarity:"",item:f.name.replace(/\.[^.]+$/,""),appeal:"",character:"",owned:false,count:0,want:false,favorite:false,parallel:false,promo:false,front:src,back:"",coordinate:""})}save();render();e.target.value=""};
$("fileInput").onchange=async e=>{
 for(const f of e.target.files){
  if(f.type.startsWith("image/")){const src=await dataUrl(f);cards.push({id:"IMG-"+Date.now()+"-"+Math.random(),cardNo:"",series:"",type:"",category:"",brand:"",rarity:"",item:f.name.replace(/\.[^.]+$/,""),appeal:"",character:"",owned:false,count:0,want:false,favorite:false,parallel:false,promo:false,front:src,back:"",coordinate:""})}
  else if(f.name.endsWith(".json")){const arr=JSON.parse(await f.text());cards=Array.isArray(arr)?arr:cards}
  else if(f.name.endsWith(".csv")){const rows=(await f.text()).split(/\r?\n/).filter(Boolean);const head=rows.shift().split(",");for(const row of rows){const vals=row.split(",");const c={};head.forEach((h,i)=>c[h]=vals[i]||"");cards.push({...{id:"CSV-"+Date.now()+"-"+Math.random(),owned:false,count:0,want:false,favorite:false,parallel:false,promo:false,front:"",back:"",coordinate:""},...c})}}
 }
 save();render();e.target.value="";
};
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aikatsu-encore-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("importJsonBtn").onclick=()=>$("jsonInput").click();
$("jsonInput").onchange=async e=>{const arr=JSON.parse(await e.target.files[0].text());if(Array.isArray(arr)){cards=arr;save();render()}};
let ticking=false;
window.addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=scrollY;if(y>lastY+8&&y>120)document.body.classList.add("compactTools");if(y<lastY-8)document.body.classList.remove("compactTools");lastY=y;ticking=false})});
$("fab").onclick=()=>{document.body.classList.remove("compactTools");$("q").focus();scrollTo({top:0,behavior:"smooth"})};
render();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
